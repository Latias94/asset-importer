name: Build Prebuilt Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v0.9.0 or asset-importer-sys-v0.9.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prebuilt-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  validate:
    name: Resolve release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Parse release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/parse-version.sh "$RELEASE_TAG"

      - name: Verify sys version and record candidate commit
        id: candidate
        shell: python
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
          TAG_CRATE: ${{ steps.version.outputs.crate }}
        run: |
          import os
          import pathlib
          import subprocess
          import tomllib

          if os.environ["TAG_CRATE"] != "asset-importer-sys":
              raise SystemExit("Native packages require v<version> or asset-importer-sys-v<version>.")
          manifest = tomllib.loads(pathlib.Path("asset-importer-sys/Cargo.toml").read_text())
          if manifest["package"]["version"] != os.environ["TAG_VERSION"]:
              raise SystemExit("Release tag does not match asset-importer-sys/Cargo.toml.")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\n")

  build-prebuilt:
    name: Build ${{ matrix.target }} (${{ matrix.link_type }}, ${{ matrix.crt || 'default CRT' }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            link_type: static
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            link_type: dylib
          - target: x86_64-apple-darwin
            os: macos-15-intel
            link_type: static
          - target: x86_64-apple-darwin
            os: macos-15-intel
            link_type: dylib
          - target: aarch64-apple-darwin
            os: macos-15
            link_type: static
          - target: aarch64-apple-darwin
            os: macos-15
            link_type: dylib
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            link_type: static
            crt: md
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            link_type: dylib
            crt: md
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            link_type: static
            crt: mt
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            link_type: dylib
            crt: mt
    env:
      ASSET_IMPORTER_PACKAGE_DIR: ${{ github.workspace }}/packages
      LINK_FEATURE: ${{ matrix.link_type == 'static' && ',static-link' || '' }}
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: prebuilt-${{ matrix.target }}-${{ matrix.link_type }}-${{ matrix.crt || 'default' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install -y cmake

      - name: Select static CRT
        if: matrix.crt == 'mt'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Clean cached local build outputs
        run: cargo clean --target ${{ matrix.target }} -p asset-importer-sys -p asset-importer

      - name: Build and package native library
        run: cargo run -p asset-importer-sys --bin package --release --locked --target ${{ matrix.target }} --no-default-features --features "build-assimp,package${{ env.LINK_FEATURE }}"

      - name: Verify prebuilt builds have no bindgen dependency
        shell: bash
        run: |
          dependencies="$(cargo tree --workspace --locked --no-default-features --features "prebuilt${{ env.LINK_FEATURE }},export,raw-sys,type-extensions,glam,mint,bytemuck" --edges normal,build --prefix none --target "${{ matrix.target }}")"
          if printf '%s\n' "$dependencies" | grep -E '^(bindgen|clang-sys) v'; then
            echo "Prebuilt builds must use the shipped bindings without libclang."
            exit 1
          fi

      - name: Test packaged binaries
        run: cargo nextest run --workspace --locked --target ${{ matrix.target }} --no-default-features --features "prebuilt${{ env.LINK_FEATURE }},export,raw-sys,type-extensions,glam,mint,bytemuck"
        env:
          ASSET_IMPORTER_OFFLINE: "1"

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-${{ matrix.target }}-${{ matrix.link_type }}-${{ matrix.crt || 'default' }}
          path: packages/asset-importer-${{ needs.validate.outputs.version }}-${{ matrix.target }}-${{ matrix.link_type }}${{ matrix.crt && format('-{0}', matrix.crt) || '' }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  upload:
    name: Attach complete package set to draft release
    needs: [validate, build-prebuilt]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: packages

      - name: Verify all ten release archives are present
        shell: python
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          import os
          import pathlib

          version = os.environ["RELEASE_VERSION"]
          expected = set()
          for target in ("x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"):
              for link in ("static", "dylib"):
                  for suffix in (("-md", "-mt") if "windows" in target else ("",)):
                      expected.add(f"asset-importer-{version}-{target}-{link}{suffix}.tar.gz")
          actual = {archive.name for archive in pathlib.Path("packages").glob("*.tar.gz")}
          if actual != expected:
              raise SystemExit(f"Unexpected archive set. Missing: {expected - actual}; extra: {actual - expected}")
          print(f"Validated {len(actual)} archives for {version}.")

      - name: Require a draft or new release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.RELEASE_TAG,
              });
              if (!release.draft) {
                core.setFailed('This workflow prepares drafts; published release assets must be left intact.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Upload to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.validate.outputs.sha }}
          draft: true
          files: packages/*.tar.gz
          fail_on_unmatched_files: true
